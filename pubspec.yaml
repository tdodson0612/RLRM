# pubspec.yaml

name: roadmap_for_rl
description: "RLRM - an unofficial, fan-made Beginner to SSL training checklist."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1 # state management
  shared_preferences: ^2.3.4 # offline progress storage (JSON), used from Stage 7
  url_launcher: ^6.3.1 # opens a mailto: draft for pack-difficulty reports; never used for http/https

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3 # makes the app icons from assets/icon/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/fonts/OFL.txt
    - assets/cars/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"